<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Enrollment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <h1>Customer Enrollment</h1>
            <p>Enroll a customer or find an existing record by user ID.</p>
        </header>

        <form id="enrollment-form">
            <div class="field">
                <label for="user_id">User ID</label>
                <input type="text" name="user_id" id="user_id" maxlength="255"
                       autocomplete="off" required>
            </div>
            <div class="field">
                <label for="first_name">First name</label>
                <input type="text" name="first_name" id="first_name" maxlength="255"
                       autocomplete="given-name" required>
            </div>
            <div class="field">
                <label for="last_name">Last name</label>
                <input type="text" name="last_name" id="last_name" maxlength="255"
                       autocomplete="family-name" required>
            </div>

            <div class="actions">
                <button type="submit" class="button button-primary">Enroll</button>
                <button type="button" class="button" data-action="search">Search</button>
                <button type="button" class="button" data-action="update">Update</button>
                <button type="button" class="button button-danger" data-action="delete">Delete</button>
                <button type="reset" class="button button-secondary">Clear</button>
            </div>
        </form>

        <p id="status-message" class="status" role="status" aria-live="polite"></p>

        <section class="customer-list" aria-labelledby="customer-list-title">
            <h2 id="customer-list-title">Customers</h2>
            <div class="list-controls">
                <label for="list-search">Search customers</label>
                <input type="search" id="list-search" maxlength="255"
                       placeholder="Search by ID or name">
                <button type="button" class="button" data-action="list">Load customers</button>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col" aria-sort="ascending">
                                <button type="button" class="sort-button" data-sort="user_id">User ID</button>
                            </th>
                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" data-sort="first_name">First name</button>
                            </th>
                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" data-sort="last_name">Last name</button>
                            </th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="customer-rows"></tbody>
                </table>
            </div>
            <div class="pagination">
                <span id="page-info" aria-live="polite">Load customers to view records.</span>
                <div>
                    <button type="button" class="button" data-action="previous-page" disabled>Previous</button>
                    <button type="button" class="button" data-action="next-page" disabled>Next</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
